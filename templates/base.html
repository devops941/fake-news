<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Fake News & Fact-Check Detector{% endblock %}</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Custom Light Theme Design System -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

  <!-- Glassmorphism Light Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="brand-title" href="{{ url_for('index') }}">
        <div class="brand-icon-wrapper">
          <i class="bi bi-shield-check"></i>
        </div>
        <span>VeriNews <span style="color: var(--primary); font-size: 0.9em;">AI</span></span>
      </a>

      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navContent">
        <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
          <div class="engine-status-tag d-none d-md-flex">
            <span class="pulse-dot"></span>
            <span>AI Fact-Check: Anthropic & Groq</span>
          </div>

          <div class="d-flex gap-2">
            <a class="nav-pill-link {% if request.endpoint == 'index' %}active{% endif %}"
              href="{{ url_for('index') }}">
              <i class="bi bi-search me-1"></i> Verify News
            </a>
            <a class="nav-pill-link {% if request.endpoint == 'history' %}active{% endif %}"
              href="{{ url_for('history') }}">
              <i class="bi bi-clock-history me-1"></i> History
            </a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="container py-4 flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  <!-- Clean Light Footer -->
  <!-- <footer class="py-4 mt-5 border-top" style="background: rgba(255, 255, 255, 0.7); border-color: var(--border-color);">
    <div class="container text-center">
      <div class="d-flex flex-wrap justify-content-center align-items-center gap-3 text-muted small">
        <span class="fw-semibold text-secondary">KZ-ML-02 Capstone</span>
        <span>&bull;</span>
        <span>Dual Verification Engine: <strong>Anthropic Claude / Groq LLM</strong> + <strong>Passive-Aggressive ML</strong></span>
        <span>&bull;</span>
        <span>Live Web Cross-Referencing</span>
      </div>
    </div>
  </footer> -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
