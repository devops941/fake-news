[project]
name = "fake-news-detector"
version = "0.1.0"
description = "Dual-Engine AI & ML Fake News Detector"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "joblib>=1.3.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "nltk>=3.8.0",
    "ddgs>=9.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "groq>=1.7.0",
]

[tool.vercel]
entrypoint = "app.py:app"

[tool.pyrefly]
python-interpreter-path = "C:\\Users\\user\\AppData\\Local\\Programs\\Python\\Python312\\python.exe"
search-paths = [
    "d:\\final_year_project\\fake_news",
    "C:\\Users\\user\\AppData\\Local\\Programs\\Python\\Python312\\Lib\\site-packages"
]
ignore-missing-imports = [
    "flask",
    "flask.*",
    "joblib",
    "joblib.*",
    "sklearn",
    "sklearn.*",
    "groq",
    "groq.*",
    "nltk",
    "nltk.*",
    "ddgs",
    "ddgs.*",
    "dotenv"
]
